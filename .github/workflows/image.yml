name: Image

# Publishes the container image to GitHub Container Registry, for amd64 and
# arm64: ghcr.io/<owner>/<repo>.
#
# - A release tag (v*) pushed to the repository publishes <version>,
#   <major>.<minor> and latest, and sha-<7 digits> of the tagged commit.
# - A run started by hand takes a ref: a release tag (to publish a release made
#   before this workflow existed: <version> and <major>.<minor>) or a branch or
#   commit, which publishes only sha-<7 digits>. A run by hand never moves latest.
#
# Each platform builds on a runner of its own architecture: built under
# emulation, arm64 did not finish within the 6-hour job limit. The digests are
# then joined into one tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Release tag (v1.2.3), or a branch or commit to publish as sha-<7 digits>"
        required: true

permissions:
  contents: read
  packages: write

env:
  REF: ${{ inputs.ref || github.ref_name }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.ref.outputs.sha }}
      short: ${{ steps.ref.outputs.short }}
      release: ${{ steps.ref.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}

      - id: ref
        run: |
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short=${sha:0:7}" >> "$GITHUB_OUTPUT"
          if [[ "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - id: image
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "pair=$(echo '${{ matrix.platform }}' | tr / -)" >> "$GITHUB_OUTPUT"

      # The commit prepare resolved, so both platforms build the same source
      # even if a branch moves meanwhile.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ steps.image.outputs.pair }}
          cache-to: type=gha,mode=max,scope=${{ steps.image.outputs.pair }}

      - run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ steps.image.outputs.pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.REF }},enable=${{ needs.prepare.outputs.release == 'true' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.REF }},enable=${{ needs.prepare.outputs.release == 'true' }}
            type=raw,value=latest,enable=${{ needs.prepare.outputs.release == 'true' && github.event_name == 'push' }}
            type=raw,value=sha-${{ needs.prepare.outputs.short }}
          flavor: latest=false

      - working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ steps.image.outputs.name }}@sha256:%s ' *)

      - run: docker buildx imagetools inspect ${{ steps.image.outputs.name }}:sha-${{ needs.prepare.outputs.short }}
