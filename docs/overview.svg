<text x="115" y="196" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">Servers, containers,</text>
<text x="115" y="216" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">network appliances</text>
<text x="115" y="250" font-size="11" font-weight="400" fill="#475569" text-anchor="middle">package + version</text>
<rect x="290" y="100" width="210" height="110" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
