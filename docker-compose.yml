services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    # PostgreSQL's own default is 128MB, far less than one large search reads
    # (see docs/operations.md#memory). Takes effect when the container restarts.
    command: ["postgres", "-c", "shared_buffers=${POSTGRES_SHARED_BUFFERS:-1GB}"]
    environment:
      POSTGRES_DB: heretix
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d heretix"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-changeme}@db:5432/heretix
      PORT: "5000"
      API_KEY: ${API_KEY}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      TRUST_PROXY: ${TRUST_PROXY:-}
      NVD_API_KEY: ${NVD_API_KEY:-}
      CISCO_CLIENT_ID: ${CISCO_CLIENT_ID:-}
      CISCO_CLIENT_SECRET: ${CISCO_CLIENT_SECRET:-}
    ports:
      # BIND_ADDRESS=127.0.0.1 leaves the port to a reverse proxy on this host (docs/tls-proxy.md).
      - "${BIND_ADDRESS:-0.0.0.0}:${PORT:-5000}:5000"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  db_data:
