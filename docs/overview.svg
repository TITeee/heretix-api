<text x="395" y="298" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">heretix-management</text>
<text x="395" y="322" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">keeps the inventory</text>
<text x="395" y="340" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">and the findings</text>
