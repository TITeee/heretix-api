<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 450" width="1080" height="450" role="img" aria-labelledby="t d" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', 'Hiragino Sans', 'Yu Gothic', 'Noto Sans JP', sans-serif">
<title id="t">heretix overview</title><desc id="d">Servers, containers and appliances are scanned by heretix-cli, which sends SBOMs to heretix-management; both search heretix-api, which imports public vulnerability sources on a schedule into PostgreSQL.</desc>
